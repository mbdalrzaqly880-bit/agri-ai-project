<!--
  ==========================================================================
  ملف login.html - صفحة تسجيل الدخول
  ==========================================================================
-->
{% extends "base.html" %}

{% block title %}تسجيل الدخول | منصة الاستشارات الزراعية الذكية{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-card">

        <h2 class="section-title">تسجيل الدخول</h2>

        {% if error %}
        <div class="alert-error">{{ error }}</div>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST" class="auth-form">

            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" name="email" required
                       placeholder="example@email.com">
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary submit-btn">دخول</button>

        </form>

        <p class="auth-switch">
            ما عندك حساب؟ <a href="{{ url_for('register') }}">أنشئ حساب جديد</a>
        </p>

    </div>
</section>

{% endblock %}
