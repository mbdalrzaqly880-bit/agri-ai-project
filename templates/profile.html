<!--
  ==========================================================================
  ملف profile.html - صفحة الحساب الشخصي للمستخدم المسجل دخول
  ==========================================================================
-->
{% extends "base.html" %}

{% block title %}حسابي | منصة الاستشارات الزراعية الذكية{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-card">

        <h2 class="section-title">مرحباً، {{ user.full_name }}</h2>

        <div class="form-group" style="text-align: right; margin-top: 20px;">
            <p><strong>البريد الإلكتروني:</strong> {{ user.email }}</p>
            <p><strong>عضو منذ:</strong> {{ user.created_at.strftime('%Y-%m-%d') }}</p>
        </div>

        <a href="{{ url_for('logout') }}" class="btn btn-secondary submit-btn"
           style="margin-top: 24px; border-color: var(--color-clay); color: var(--color-clay);">
            تسجيل الخروج
        </a>

    </div>
</section>

{% endblock %}
